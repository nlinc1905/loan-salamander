name: CLA Assistant
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    steps:
      - name: CLA Assistant
        if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@v2.6.1  # check README for the current tag
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PERSONAL_ACCESS_TOKEN: ${{ secrets.CLA_PAT }}  # needed if signatures live in another repo
        with:
          path-to-signatures: 'signatures/cla.json'
          path-to-document: 'https://github.com/nlinc1905/loan-salamander/blob/main/CLA.md'
          branch: 'cla-signatures'
          allowlist: 'nlinc1905,dependabot[bot],bot*'
